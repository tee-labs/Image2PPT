name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    concurrency:
      # Concurrency control: Ensures only one instance of OpenCode runs per PR/Issue.
      # If a new command is triggered (e.g., another "/oc" comment), the previous pending run is canceled.
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Configure Git identity
        shell: bash
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"
      - name: Parse model from comment
        id: model
        shell: bash
        run: |
          COMMENT="${{ github.event.comment.body }}"
          DEFAULT="glm/glm-5.3-flash"
          if [[ "$COMMENT" == *"@zen"* ]]; then
            M="zen/muse-spark-1.3-contributor-free"
          elif [[ "$COMMENT" == *"@glm52"* ]]; then
            M="glm/glm-5.2"
          elif [[ "$COMMENT" == *"@glm53"* ]]; then
            M="glm/glm-5.3"
          else
            M="$DEFAULT"
          fi
          echo "model=$M" >> "$GITHUB_OUTPUT"
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        with:
          use_github_token: true
          model: ${{ steps.model.outputs.model }}
